                      "crossplane.io/external-name" = oxr.metadata.name + "-cluster-auth-kubernetes-usage"
                      "krm.kcl.dev/composition-resource-name" = oxr.metadata.name + "-cluster-auth-kubernetes-usage"
                  }
              }
              spec = {
